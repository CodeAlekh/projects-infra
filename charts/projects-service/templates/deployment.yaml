apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "projects-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "projects-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: password
          livenessProbe:
            httpGet:
              path: /projects/livez
              port: http
          readinessProbe:
            httpGet:
              path: /projects/readyz
              port: http
          startupProbe:
            httpGet:
              path: /projects/livez
              port: http
            periodSeconds: 12
            failureThreshold: 10
