apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: projects-service
  template:
    metadata:
      labels:
        app: projects-service
    spec:
      containers:
        - name: projects-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 12
            failureThreshold: 10
