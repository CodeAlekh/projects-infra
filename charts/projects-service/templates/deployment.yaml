apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: projects-service
  template:
    metadata:
      labels:
        app: projects-service
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: projects-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: projects-service-config
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: password
          livenessProbe:
            httpGet:
              path: /projects/livez
              port: http
          readinessProbe:
            httpGet:
              path: /projects/readyz
              port: http
          startupProbe:
            httpGet:
              path: /projects/livez
              port: http
            periodSeconds: 12
            failureThreshold: 10
